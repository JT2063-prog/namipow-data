name: Season history (JMA)
on:
  schedule:
    - cron: '41 21 * * *'   # daily, 06:41 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['seasons.js', '.github/workflows/seasons.yml']
permissions:
  contents: write
concurrency: fetch
jobs:
  seasons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node seasons.js
      - name: Commit if changed
        run: |
          git config user.name "namipow-bot"
          git config user.email "namipow-bot@users.noreply.github.com"
          git add seasons.json seasons-log.txt
          git diff --cached --quiet || (git commit -m "Season history $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
